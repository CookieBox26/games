<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クイズ</title>
<style type="text/css">
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;800&display=swap');
:root {
  --header: #14adbc;
  --white: #f3f3f3;
  --black: #242424;
  --overlay: rgba(0, 0, 0, 0.65);
  --grey: #aaaaaa;
  --choice-bg: #d0d0d0;
  --card-bg: #d0d0d0;
  --ok-bg: #a5e1b4;
  --ok-color: #37904d;
  --ng-bg: #f6c9c5;
  --ng-color: #e35649;
  --width: 360px;
  --height: 600px;
  --height-header: 40px;
  --height-area: calc(600px - 40px);
}
html, body {
  overscroll-behavior: none;
}
body {
  margin: 0;
  background: var(--black);
  font-family: "Noto Sans JP", sans-serif;
  font-size: 18px;
  letter-spacing: 0.02em;
}
p {
  margin: 0 0 0.5em;
}
div#mat {
  width: var(--width);
  height: var(--height);
  background: var(--white);
  color: var(--black);
}
div.flex {
  display: flex;
  flex-flow: row wrap;
  align-items: start;
}
div.container {
  width: var(--width);
  height: var(--height);
  flex-flow: column wrap;
  align-items: stretch;
}
div.header {
  box-sizing: border-box;
  height: var(--height-header);
  width: 100%;
  background: var(--header);
  align-items: center;
}
div.header > div {
  font-size: 20px;
  line-height: 20px;
  margin: 0 18px;
  color: var(--white);
  cursor: pointer;
  user-select: none;
}
div#main {
  flex-grow: 1;
  overflow: hidden;
}
div#modal, div#info-modal {
  position: absolute;
  top: var(--height-header);
  left: 0;
  width: var(--width);
  height: var(--height-area);
  justify-content: center;
  align-items: center;
  background: var(--overlay);
}
div.modal-content {
  box-sizing: border-box;
  padding: 20px;
  max-width: 90%;
  flex-flow: column;
  align-items: center;
  gap: 10px;
  background: var(--white);
  font-size: 20px;
  line-height: 1.2;
}
div.area {
  box-sizing: border-box;
  width: var(--width);
  height: var(--height-area);
  padding: 15px 18px;
  line-height: 1.2;
  display: none;
  flex-flow: column;
  gap: 10px;
  overflow-y: auto;
}
div#top {
  align-items: center;
}
div.main-btn {
  width: 100%;
  height: 40px;
  line-height: 40px;
  color: var(--white);
  font-size: 18px;
  text-align: center;
  background: var(--black);
  cursor: pointer;
  user-select: none;
  flex-shrink: 0;
}
div.main-btn.disabled {
  background: var(--grey);
  pointer-events: none;
}
div#question-number {
  font-size: 20px;
  font-weight: bold;
}
div#question {
  line-height: 25px;
  max-height: 100px;
  overflow-y: auto;
}
div#choices-container {
  margin: 4px 0;
  display: flex;
  flex-flow: column;
  gap: 8px;
}
div.choice-btn {
  box-sizing: border-box;
  width: 100%;
  padding: 8px 12px;
  background: var(--choice-bg);
  font-size: 17px;
  line-height: 1.4;
  cursor: pointer;
  user-select: none;
  border-left: 10px solid var(--grey);
}
div.choice-btn.correct {
  background: var(--ok-bg);
  border-left-color: var(--ok-color);
}
div.choice-btn.wrong {
  background: var(--ng-bg);
  border-left-color: var(--ng-color);
}
div#message {
  font-weight: bold;
}
div#desc {
  flex: 1;
  font-size: 16px;
  overflow-y: auto;
}
div.quiz-card {
  box-sizing: border-box;
  padding: 12px;
  background: var(--card-bg);
  flex-shrink: 0;
}
div.quiz-card.ok {
  background: var(--ok-bg);
}
div.quiz-card.ng {
  background: var(--ng-bg);
}
div.quiz-title {
  font-size: 17px;
  font-weight: bold;
  margin-bottom: 4px;
}
div.quiz-desc {
  font-size: 15px;
}
</style>
</head>
<body onload="init()">

<div id="mat">

<div class="flex container">

<div class="flex header">
<div id="header-btn-top"><b>TOP</b></div>
</div>

<div id="main">

<div id="top" class="area">
<div style="font-size: 55px;"><b>クイズ</b></div>
<div><p>現在の正解数は <span id="span-count"></span> です。</p></div>
<div id="main-btn-study" class="main-btn">勉強する</div>
<div id="main-btn-test-all" class="main-btn">すべての問題を解く</div>
<div id="main-btn-test-untried" class="main-btn">未挑戦の問題を解く</div>
<div id="main-btn-test-wrong" class="main-btn">間違えた問題を解く</div>
<div id="main-btn-reset" class="main-btn">リセットする</div>
</div>

<div id="test" class="area">
<div id="question-number"></div>
<div id="question"></div>
<div id="choices-container"></div>
<div id="message"></div>
<div id="desc"></div>
<div id="next-btn" class="main-btn" style="display:none;">次の問題へ</div>
<!--<div id="back" class="main-btn" style="display:none;">トップに戻る</div>-->
</div>

<div id="study" class="area">
</div>

</div>
</div>

<div id="modal" class="flex">
<div class="flex modal-content">
<div><p>本当にリセットしますか？</p></div>
<div id="modal-btn-reset" class="main-btn">リセットする</div>
<div id="modal-btn-cancel" class="main-btn">リセットしない</div>
</div>
</div>

<div id="info-modal" class="flex">
<div class="flex modal-content">
<div id="info-modal-message"></div>
<div id="info-modal-ok" class="main-btn">OK</div>
</div>
</div>

</div>

<script type="text/javascript"><!--
const knowledgeMaster = [
  {
    id: 'sha-touhoku',
    title: '東北地方にある県',
    desc: '東北地方には青森県・岩手県・宮城県・秋田県・山形県・福島県の6つの県があります。',
  },
  {
    id: 'sha-kanto',
    title: '関東地方にある都県',
    desc: '関東地方には東京都・神奈川県・埼玉県・千葉県・茨城県・栃木県・群馬県の7つの都県があります。',
  },
  {
    id: 'sha-chubu',
    title: '中部地方にある県',
    desc: '中部地方には新潟県・富山県・石川県・福井県・山梨県・長野県・岐阜県・静岡県・愛知県の9つの県があります。',
  },
  {
    id: 'sha-kinki',
    title: '近畿地方にある府県',
    desc: '近畿地方には三重県・滋賀県・京都府・大阪府・兵庫県・奈良県・和歌山県の7つの府県があります。',
  },
  {
    id: 'sha-chugoku',
    title: '中国地方にある県',
    desc: '中国地方には鳥取県・島根県・岡山県・広島県・山口県の5つの県があります。',
  },
  {
    id: 'sha-shikoku',
    title: '四国地方にある県',
    desc: '四国地方には徳島県・香川県・愛媛県・高知県の4つの県があります。',
  },
  {
    id: 'sha-kyushu',
    title: '九州地方にある県',
    desc: '九州地方には福岡県・佐賀県・長崎県・熊本県・大分県・宮崎県・鹿児島県・沖縄県の8つの県があります。',
  },
  {
    id: 'sha-nairiku',
    title: '内陸県',
    desc: '県境が海に面していない県を内陸県といい、日本に8県あります。関東地方では栃木県・群馬県・埼玉県 (3県)、中部地方では山梨県・長野県・岐阜県 (3県)、近畿地方では滋賀県・奈良県 (2県) が内陸県です。',
  },
  {
    id: 'sha-shikoku-capital',
    title: '四国地方の県庁所在地',
    desc: '四国地方の県庁所在地は、香川県<b>高松市</b>、愛媛県<b>松山市</b>、徳島県徳島市、高知県高知市です。',
  },
  {
    id: 'sha-tokyo-pop',
    title: '東京都の人口',
    desc: '東京都の人口は約1400万人です。',
  },
];

const questionMaster = [
  {
    q: '東北地方にはいくつの県がありますか。',
    choices: ['5つ', '6つ', '7つ', '8つ'],
    answer: 1,
    shuffleChoices: false,
    knowledgeIds: ['sha-touhoku'],
  },
  {
    q: '関東地方にはいくつの都道府県がありますか。',
    choices: ['5つ', '6つ', '7つ', '8つ'],
    answer: 2,
    shuffleChoices: false,
    knowledgeIds: ['sha-kanto'],
  },
  {
    q: '中部地方にはいくつの県がありますか。',
    choices: ['7つ', '8つ', '9つ', '10つ'],
    answer: 2,
    shuffleChoices: false,
    knowledgeIds: ['sha-chubu'],
  },
  {
    q: '近畿地方にはいくつの都道府県がありますか。',
    choices: ['5つ', '6つ', '7つ', '8つ'],
    answer: 2,
    shuffleChoices: false,
    knowledgeIds: ['sha-kinki'],
  },
  {
    q: '中国地方にはいくつの県がありますか。',
    choices: ['4つ', '5つ', '6つ', '7つ'],
    answer: 1,
    shuffleChoices: false,
    knowledgeIds: ['sha-chugoku'],
  },
  {
    q: '四国地方にはいくつの県がありますか。',
    choices: ['3つ', '4つ', '5つ', '6つ'],
    answer: 1,
    shuffleChoices: false,
    knowledgeIds: ['sha-shikoku'],
  },
  {
    q: '九州地方にはいくつの県がありますか (沖縄県を含む)。',
    choices: ['5つ', '6つ', '7つ', '8つ'],
    answer: 3,
    shuffleChoices: false,
    knowledgeIds: ['sha-kyushu'],
  },
  {
    q: '東京都の人口はおよそ何万人ですか。',
    choices: ['約800万人', '約1000万人', '約1200万人', '約1400万人'],
    answer: 3,
    shuffleChoices: false,
    knowledgeIds: ['sha-tokyo-pop'],
  },
  {
    q: '四国地方には、県庁所在地名が県名と異なる県がいくつありますか。',
    choices: ['1つ', '2つ', '3つ', '4つ'],
    answer: 1,
    shuffleChoices: false,
    knowledgeIds: ['sha-shikoku-capital'],
  },
  {
    q: '近畿地方には内陸県がいくつありますか。',
    choices: ['1つ', '2つ', '3つ', '4つ'],
    answer: 1,
    shuffleChoices: false,
    knowledgeIds: ['sha-nairiku'],
  },
  {
    q: '中部地方には内陸県がいくつありますか。',
    choices: ['1つ', '2つ', '3つ', '4つ'],
    answer: 2,
    shuffleChoices: false,
    knowledgeIds: ['sha-nairiku'],
  },
];

const knowledgeMap = Object.fromEntries(knowledgeMaster.map(k => [k.id, k]));

const mat = document.getElementById('mat');
const modal = document.getElementById("modal");
const divTop = document.getElementById("top");
const divTest = document.getElementById("test");
const divStudy = document.getElementById("study");
const divQN = document.getElementById("question-number");
const divQ = document.getElementById("question");
const divChoices = document.getElementById("choices-container");
const divMsg = document.getElementById("message");
const divDesc = document.getElementById("desc");
const nextBtn = document.getElementById("next-btn");
// const backBtn = document.getElementById("back");

var currentIdx = -1;
var quizQueue = [];
var quizTotal = 0;
var shuffledAnswer = -1;

function loadList(key) {
  const json = localStorage.getItem(key);
  return json ? JSON.parse(json) : [];
}

function markItem(okKey, ngKey, item, correct) {
  let ok = loadList(okKey);
  let ng = loadList(ngKey);
  if (correct) {
    if (!ok.includes(item)) ok.push(item);
    ng = ng.filter(i => i !== item);
  } else {
    ok = ok.filter(i => i !== item);
    if (!ng.includes(item)) ng.push(item);
  }
  localStorage.setItem(okKey, JSON.stringify(ok));
  localStorage.setItem(ngKey, JSON.stringify(ng));
}

function mark(idx, correct) {
  markItem('quiz-ok', 'quiz-ng', idx, correct);
  questionMaster[idx].knowledgeIds.forEach(id => {
    markItem('knowledge-ok', 'knowledge-ng', id, correct);
  });
}

function resetLayout() {
  let w = Math.max(Math.floor(0.5 * (window.innerWidth - mat.clientWidth)), 0);
  let h = Math.max(Math.floor(0.5 * (window.innerHeight - mat.clientHeight)), 0);
  mat.style.margin = `${h}px ${w}px`;
  modal.style.margin = `${h}px ${w}px`;
  document.getElementById('info-modal').style.margin = `${h}px ${w}px`;
}

function setButton(id, handle) {
  document.getElementById(id).addEventListener("click", handle);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQueue(mode) {
  const ok = loadList('quiz-ok');
  const ng = loadList('quiz-ng');
  const all = questionMaster.map((_, i) => i);
  if (mode === 'all') return shuffle(all);
  if (mode === 'untried') return shuffle(all.filter(i => !ok.includes(i) && !ng.includes(i)));
  if (mode === 'wrong') return shuffle(all.filter(i => ng.includes(i)));
  return [];
}

function showInfoModal(message) {
  document.getElementById('info-modal-message').innerHTML = `<p>${message}</p>`;
  document.getElementById('info-modal').style.display = 'flex';
}

function setQ() {
  if (quizQueue.length === 0) {
    showTop();
    return;
  }
  currentIdx = quizQueue.pop();
  const item = questionMaster[currentIdx];
  divQN.innerHTML = `問題 ${quizTotal - quizQueue.length} / ${quizTotal}`;
  divQ.innerHTML = item.q;
  const order = item.shuffleChoices
    ? shuffle(item.choices.map((_, i) => i))
    : item.choices.map((_, i) => i);
  shuffledAnswer = order.indexOf(item.answer);
  divChoices.innerHTML = '';
  order.forEach((origIdx, i) => {
    const div = document.createElement('div');
    div.classList.add('choice-btn');
    div.innerHTML = item.choices[origIdx];
    div.addEventListener('click', () => onChoiceClick(i));
    divChoices.appendChild(div);
  });
  divMsg.innerHTML = '';
  divMsg.style.color = '';
  divDesc.innerHTML = '';
  divDesc.style.color = '';
  nextBtn.style.display = 'none';
  // backBtn.style.display = 'none';
}

function onChoiceClick(chosenIdx) {
  const item = questionMaster[currentIdx];
  const btns = divChoices.querySelectorAll('.choice-btn');
  btns.forEach(b => b.style.pointerEvents = 'none');
  btns[shuffledAnswer].classList.add('correct');
  const correct = chosenIdx === shuffledAnswer;
  if (!correct) btns[chosenIdx].classList.add('wrong');
  mark(currentIdx, correct);
  divMsg.style.color = correct ? 'var(--ok-color)' : 'var(--ng-color)';
  divMsg.innerHTML = correct ? '正解です。' : '不正解です。';
  divDesc.style.color = correct ? 'var(--ok-color)' : 'var(--ng-color)';
  divDesc.innerHTML = item.knowledgeIds
    .map(id => knowledgeMap[id])
    .filter(Boolean)
    .map(k => `<p>${k.desc}</p>`)
    .join('<br/>');
  nextBtn.style.display = 'block';
  // backBtn.style.display = 'block';
}

function setStudy() {
  divStudy.innerHTML = '';
  const kok = loadList('knowledge-ok');
  const kng = loadList('knowledge-ng');
  knowledgeMaster.forEach(item => {
    const card = document.createElement('div');
    card.classList.add('quiz-card');
    if (kok.includes(item.id)) card.classList.add('ok');
    else if (kng.includes(item.id)) card.classList.add('ng');
    card.innerHTML = `
      <div class="quiz-title">${item.title}</div>
      <div class="quiz-desc">${item.desc}</div>
    `;
    divStudy.appendChild(card);
  });
}

function showTop() {
  document.getElementById("span-count").innerText = loadList('quiz-ok').length;
  divTop.style.display = "flex";
  divTest.style.display = "none";
  divStudy.style.display = "none";
  modal.style.display = "none";
  document.getElementById('info-modal').style.display = 'none';
}

function showTest(mode) {
  quizQueue = buildQueue(mode);
  quizTotal = quizQueue.length;
  if (quizQueue.length === 0) {
    const msg = mode === 'untried' ? '未挑戦の問題はないです。' : '間違えた問題はないです。';
    showInfoModal(msg);
    return;
  }
  divTop.style.display = "none";
  divTest.style.display = "flex";
  divStudy.style.display = "none";
  setQ();
}

function showStudy() {
  setStudy();
  divTop.style.display = "none";
  divTest.style.display = "none";
  divStudy.style.display = "flex";
}

function init() {
  resetLayout();
  window.addEventListener('resize', resetLayout);

  setButton("header-btn-top", showTop);
  setButton("main-btn-study", showStudy);
  setButton("main-btn-test-all", () => showTest('all'));
  setButton("main-btn-test-untried", () => showTest('untried'));
  setButton("main-btn-test-wrong", () => showTest('wrong'));
  setButton("next-btn", setQ);
  // setButton("back", showTop);
  setButton("info-modal-ok", () => { document.getElementById('info-modal').style.display = 'none'; });

  setButton("main-btn-reset", () => {
    modal.style.display = "flex";
  });
  setButton("modal-btn-reset", () => {
    localStorage.removeItem('quiz-ok');
    localStorage.removeItem('quiz-ng');
    localStorage.removeItem('knowledge-ok');
    localStorage.removeItem('knowledge-ng');
    showTop();
    modal.style.display = "none";
  });
  setButton("modal-btn-cancel", () => {
    modal.style.display = "none";
  });

  showTop();
  modal.style.display = "none";
}
// --></script>
</body>
</html>
